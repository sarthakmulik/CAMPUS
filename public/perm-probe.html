<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>perm-probe</title>
</head>
<body>
  <pre id="out">permission probe — waiting for result…</pre>
  <script>
    (function () {
      var pre = document.getElementById('out');
      function say(s) { pre.textContent = s; }
      if (typeof Notification === 'undefined') { say('SUPPORTED=no'); return; }
      say('initial permission=' + Notification.permission + ' — calling requestPermission()…');
      Notification.requestPermission().then(function (r) {
        say('REQ_RES=' + r + '  after=' + Notification.permission);
      }).catch(function (e) { say('ERR ' + e); });
    })();
  </script>
</body>
</html>
